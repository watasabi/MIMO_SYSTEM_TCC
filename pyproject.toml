[project]
name = "mimo-sys"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.3.0",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
    "ruff>=0.16.7",
]
plot = [
    "matplotlib>=3.11.2",
    "plotly>=7.0.0",
    "seaborn>=0.13.2",
]


[tool.ruff]
line-length = 79

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']
ignore = ['E402', 'F811']
