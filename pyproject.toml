[project]
name = "mimo-sys"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dtaidistance>=2.5.1",
    "ewtpy>=0.2.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.5",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.3.0",
]
ml = [
    "lightning>=2.6.6",
    "mlflow>=3.16.1",
    "torch>=2.14.0",
    "torchmetrics>=1.9.0",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
    "pytest>=8.4.2",
    "ruff>=0.16.7",
]
plot = [
    "plotly>=7.0.0",
    "seaborn>=0.13.2",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mimo_sys"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']
ignore = ['E402', 'F811']

[tool.ruff.lint.pylint]
# Model constructors carry one argument per hyperparameter; they are
# keyword-only past the geometry, so call sites stay explicit.
max-args = 12
