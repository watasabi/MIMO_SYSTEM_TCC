<svg viewBox="0 0 980 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Protocolo de janelamento: cada janela de entrada tem 24 passos horários terminando no instante t-1, o alvo são os 12 passos seguintes a partir de t, e a próxima janela começa exatamente onde o alvo anterior terminou, sem sobreposição entre janelas consecutivas.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="300" fill="#ffffff"/>

  <text x="20" y="26" font-family="sans-serif" font-size="15" font-weight="600" fill="#111111">Protocolo de janelamento (forecast encadeado)</text>
  <text x="20" y="44" font-family="sans-serif" font-size="11.5" fill="#555555">mimo_sys.training.evaluation.chained_forecast — mesmo protocolo para os 5 modelos do ensemble</text>

  <!-- timeline axis -->
  <line x1="40" y1="200" x2="940" y2="200" stroke="#888888" stroke-width="1"/>

  <!-- window 1: input (24 steps) -->
  <rect x="60" y="150" width="260" height="40" fill="#eef3fc" stroke="#2f5aa8" stroke-width="1.5"/>
  <text x="190" y="174" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c3b70">janela de entrada — 24 passos</text>

  <!-- anchor marker -->
  <line x1="320" y1="140" x2="320" y2="260" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="320" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">t</text>

  <!-- horizon 1: target (12 steps) -->
  <rect x="320" y="150" width="130" height="40" fill="#f3d9d9" stroke="#a33a3a" stroke-width="1.5"/>
  <text x="385" y="174" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7a2626">alvo — 12 passos</text>

  <!-- next window starts exactly where target ended -->
  <line x1="450" y1="140" x2="450" y2="260" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="450" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">t+12</text>

  <rect x="450" y="150" width="130" height="40" fill="#eef3fc" stroke="#2f5aa8" stroke-width="1.5" opacity="0.55"/>
  <text x="515" y="174" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1c3b70">próxima janela</text>

  <rect x="580" y="150" width="90" height="40" fill="#f3d9d9" stroke="#a33a3a" stroke-width="1.5" opacity="0.55"/>
  <text x="625" y="174" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#7a2626">próximo alvo</text>

  <text x="760" y="174" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">...</text>

  <!-- annotations -->
  <text x="190" y="225" text-anchor="middle" font-family="sans-serif" font-size="10.8" fill="#1c3b70">x = dado[t-24 : t]</text>
  <text x="385" y="225" text-anchor="middle" font-family="sans-serif" font-size="10.8" fill="#7a2626">y = dado[t : t+12]</text>

  <text x="40" y="250" font-family="sans-serif" font-size="11" fill="#333333">sem sobreposição: cada instante aparece</text>
  <text x="40" y="266" font-family="sans-serif" font-size="11" fill="#333333">no alvo de exatamente uma janela</text>

  <text x="760" y="250" font-family="sans-serif" font-size="11" fill="#333333">a janela nunca inclui o instante</text>
  <text x="760" y="266" font-family="sans-serif" font-size="11" fill="#333333">que ela mesma está prevendo</text>
</svg>
