<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Pipeline da cascata física: uma janela de entrada alimenta 5 modelos cujas previsões são promediadas; vazao_distribuicao e pressao seguem direto para a previsão final, enquanto nivel_res é recalculado por um modelo de balanço de massa alimentado pela própria previsão de vazao_distribuicao do ensemble e pela vazão de entrada, conhecida no horizonte.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d46"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5aa8"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>

  <text x="20" y="28" font-family="sans-serif" font-size="17" font-weight="600" fill="#111111">Cascata física: ensemble de previsão + modelo de balanço de massa</text>
  <text x="20" y="48" font-family="sans-serif" font-size="12.5" fill="#555555">split 70/15/15, forecast encadeado de 12 passos, teste — docs/7_tecnica-cascata-fisica.md</text>
  <text x="20" y="65" font-family="sans-serif" font-size="11" fill="#777777">legenda: linha sólida verde = alimenta a cascata · linha tracejada = segue sem alteração até a saída final · linha azul = conhecida/observada, nunca prevista</text>

  <!-- Column A: input window -->
  <g>
    <rect x="20" y="90" width="190" height="210" rx="8" fill="#eef3fc" stroke="#2f5aa8" stroke-width="1.5"/>
    <text x="115" y="114" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1c3b70">Janela de entrada</text>
    <text x="115" y="134" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c3b70">(batch, 24, 7)</text>
    <line x1="35" y1="146" x2="195" y2="146" stroke="#2f5aa8" stroke-width="0.75"/>
    <text x="35" y="164" font-family="sans-serif" font-size="11.5" fill="#1c3b70">24 passos horários</text>
    <text x="35" y="181" font-family="sans-serif" font-size="11.5" fill="#1c3b70">7 séries: u1..u4, y1..y3</text>
    <text x="35" y="198" font-family="sans-serif" font-size="11.5" fill="#1c3b70">(y1..y3 = próprias saídas</text>
    <text x="35" y="213" font-family="sans-serif" font-size="11.5" fill="#1c3b70">passadas: memória do sistema)</text>
    <text x="35" y="238" font-family="sans-serif" font-size="11.5" font-style="italic" fill="#1c3b70">vazao_entrada[t..t+11]</text>
    <text x="35" y="253" font-family="sans-serif" font-size="11.5" font-style="italic" fill="#1c3b70">conhecida no horizonte</text>
    <text x="35" y="268" font-family="sans-serif" font-size="11.5" font-style="italic" fill="#1c3b70">(entrada exógena, não prevista)</text>
  </g>

  <!-- Arrow A -> B -->
  <line x1="210" y1="190" x2="268" y2="190" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Column B: ensemble -->
  <g>
    <rect x="270" y="70" width="270" height="340" rx="8" fill="#fdf1e6" stroke="#b5651d" stroke-width="1.5"/>
    <text x="405" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#7a4310">Ensemble (5 modelos)</text>

    <g font-family="sans-serif" font-size="11" fill="#5c360c">
      <rect x="286" y="108" width="238" height="30" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1"/>
      <text x="296" y="127">MPNN (seed 42, message_dim=8)</text>

      <rect x="286" y="144" width="238" height="30" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1"/>
      <text x="296" y="163">MPNN (seed 42, message_dim=16)</text>

      <rect x="286" y="180" width="238" height="30" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1"/>
      <text x="296" y="199">StemGNN (seed 43)</text>

      <rect x="286" y="216" width="238" height="30" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1"/>
      <text x="296" y="235">Seq2SeqLatentGNN (seed 42)</text>

      <rect x="286" y="252" width="238" height="30" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1"/>
      <text x="296" y="271">Seq2SeqLatentGNN (seed 43)</text>
    </g>

    <text x="405" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7a4310">cada um: (batch, 24, 7) -&gt; (batch, 12, 3)</text>

    <line x1="405" y1="306" x2="405" y2="326" stroke="#7a4310" stroke-width="1.25" marker-end="url(#arrow)"/>
    <rect x="310" y="330" width="190" height="60" rx="6" fill="#fbe3c8" stroke="#b5651d" stroke-width="1.25"/>
    <text x="405" y="352" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#5c360c">average_predictions</text>
    <text x="405" y="368" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5c360c">média simples, por saída</text>
  </g>

  <!-- Arrow B -> C -->
  <line x1="540" y1="360" x2="598" y2="360" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="569" y="352" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#333333">(batch,12,3)</text>

  <!-- Column C: ensemble's 3 raw channel predictions -->
  <g font-family="sans-serif" font-size="11.5">
    <text x="703" y="300" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111111">Previsão do ensemble</text>

    <rect x="603" y="312" width="200" height="34" rx="5" fill="#fbe3c8" stroke="#b5651d" stroke-width="1"/>
    <text x="703" y="333" text-anchor="middle" fill="#5c360c">vazao_distribuicao — R² 0,929</text>

    <rect x="603" y="378" width="200" height="34" rx="5" fill="#f3d9d9" stroke="#a33a3a" stroke-width="1"/>
    <text x="703" y="399" text-anchor="middle" fill="#7a2626">nivel_res (bruto) — R² 0,508</text>
    <text x="703" y="428" text-anchor="middle" font-size="10.5" font-style="italic" fill="#a33a3a">descartado, substituído pela cascata</text>

    <rect x="603" y="444" width="200" height="34" rx="5" fill="#fbe3c8" stroke="#b5651d" stroke-width="1"/>
    <text x="703" y="465" text-anchor="middle" fill="#5c360c">pressao — R² 0,740</text>
  </g>

  <!-- vazao_distribuicao -> physics cascade (solid, green: feeds the cascade) -->
  <path d="M 803,329 L 860,329 L 860,200 L 918,200" fill="none" stroke="#2e7d46" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- vazao_distribuicao -> final output (dashed passthrough) -->
  <path d="M 803,329 L 870,329 L 870,495 L 918,495" fill="none" stroke="#888888" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>

  <!-- pressao -> final output (dashed passthrough) -->
  <path d="M 803,461 L 895,461 L 895,563 L 918,563" fill="none" stroke="#888888" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>

  <!-- known-future inflow and level anchor from window A into cascade (blue, left edge of D) -->
  <path d="M 115,300 L 115,650 L 900,650 L 900,250 L 918,250" fill="none" stroke="#2f5aa8" stroke-width="1.25" marker-end="url(#arrow-blue)"/>
  <text x="500" y="666" text-anchor="middle" font-family="sans-serif" font-size="10.8" fill="#1c3b70">vazao_entrada[t..t+11] (exógena) + nivel_res[t-1] (âncora observada)</text>

  <!-- Column D: physics cascade -->
  <g>
    <rect x="920" y="90" width="230" height="210" rx="8" fill="#eaf7ee" stroke="#2e7d46" stroke-width="1.5"/>
    <text x="1035" y="114" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d5c32">Cascata física</text>
    <text x="1035" y="131" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1d5c32">(balanço de massa)</text>
    <line x1="935" y1="142" x2="1135" y2="142" stroke="#2e7d46" stroke-width="0.75"/>
    <text x="935" y="160" font-family="sans-serif" font-size="10.8" fill="#1d5c32">q[k] = vazao_entrada[k]</text>
    <text x="935" y="174" font-family="sans-serif" font-size="10.8" fill="#1d5c32">    - vazao_distribuicao[k]</text>
    <text x="935" y="195" font-family="sans-serif" font-size="10.8" fill="#1d5c32">Δnível[k] = a·média(q[k],q[k-1]) + b</text>
    <text x="935" y="215" font-family="sans-serif" font-size="10.3" font-style="italic" fill="#1d5c32">a, b: mínimos quadrados,</text>
    <text x="935" y="229" font-family="sans-serif" font-size="10.3" font-style="italic" fill="#1d5c32">ajustados 1x no split de treino</text>
    <text x="935" y="252" font-family="sans-serif" font-size="10.8" fill="#1d5c32">nivel[k] = nivel[k-1] + Δnível[k]</text>
    <text x="935" y="266" font-family="sans-serif" font-size="10.8" fill="#1d5c32">propagado pelos 12 passos</text>
    <text x="935" y="285" font-family="sans-serif" font-size="10.3" font-style="italic" fill="#1d5c32">sem retreinar nenhum modelo</text>
  </g>

  <line x1="1035" y1="300" x2="1035" y2="468" stroke="#2e7d46" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Column E: final output -->
  <g>
    <text x="1035" y="458" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#111111">Previsão final (batch, 12, 3)</text>
    <rect x="920" y="470" width="230" height="130" rx="8" fill="#f5f0fa" stroke="#6a3fa0" stroke-width="1.5"/>

    <rect x="936" y="482" width="198" height="26" rx="4" fill="#ffffff" stroke="#6a3fa0" stroke-width="0.9"/>
    <text x="1035" y="499" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#412568">vazao_distribuicao — R² 0,929</text>

    <rect x="936" y="516" width="198" height="26" rx="4" fill="#ffffff" stroke="#2e7d46" stroke-width="1.4"/>
    <text x="1035" y="533" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#1d5c32">nivel_res (cascata) — R² 0,758</text>

    <rect x="936" y="550" width="198" height="26" rx="4" fill="#ffffff" stroke="#6a3fa0" stroke-width="0.9"/>
    <text x="1035" y="567" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#412568">pressao — R² 0,740</text>
  </g>

  <text x="1035" y="625" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#111111">R² médio = 0,809</text>
  <text x="1035" y="643" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#555555">vs. 0,726 sem a cascata (ensemble sozinho)</text>
  <text x="1035" y="658" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#555555">vs. 0,618 baseline (notebook 04)</text>
</svg>
